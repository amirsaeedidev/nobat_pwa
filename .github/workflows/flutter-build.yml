name: Build Android APK

# Keep only the newest run for each workflow/branch; stale queued runs are not useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/flutter-analyze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons from Iconapp asset
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Verify APK package, size and signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*-release.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No split release APKs were generated."
            exit 1
          fi
          SDK_ROOT="$ANDROID_HOME"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          {
            echo "## Android Release APK verification"
            echo
            echo "- Build mode: **Release / split per ABI**"
            echo "- Package: **com.datetime.datetime**"
            echo "- Signing: **Debug keystore for test builds; not Play Store signing**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for APK in "${APKS[@]}"; do
            test -s "$APK"
            APK_SIZE_BYTES="$(stat -c%s "$APK")"
            if [ "$APK_SIZE_BYTES" -lt 3000000 ] || [ "$APK_SIZE_BYTES" -gt 100000000 ]; then
              echo "::error::APK size outside expected split-build range: $APK ($APK_SIZE_BYTES bytes)"
              exit 1
            fi
            "$APKSIGNER" verify --verbose --print-certs "$APK" > apk-signature.txt
            "$AAPT" dump badging "$APK" | grep -F "package: name='com.datetime.datetime'" >/dev/null
            APK_SIZE_MB="$(awk -v bytes="$APK_SIZE_BYTES" 'BEGIN { printf "%.1f", bytes / 1048576 }')"
            echo "- `$(basename "$APK")`: **$APK_SIZE_MB MB**, signature verified" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: nobat-amir-release-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
