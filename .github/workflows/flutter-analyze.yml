name: Flutter Analyze

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - '.github/workflows/flutter-build.yml'
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check legacy brand references
        shell: bash
        run: |
          legacy_brand="$(printf 'on%s' 'time')"
          if git grep -ni -I -E "$legacy_brand" -- .; then
            echo "::error::Legacy brand reference found. Use DateTime instead."
            exit 1
          fi
          echo "No legacy brand references found."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons from Iconapp asset
        run: dart run flutter_launcher_icons

      - name: Enforce Hugeicons-only icon policy
        id: icon_policy
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          roots = [Path("lib"), Path("test")]
          patterns = [
              ("Material Icons catalog", re.compile(r"\bIcons\s*\.")),
              ("Material IconData", re.compile(r"\bIconData\b")),
              ("ImageIcon widget", re.compile(r"\bImageIcon\s*\(")),
          ]
          violations = []
          scanned = 0
          for root in roots:
              if not root.exists():
                  continue
              for file in root.rglob("*.dart"):
                  scanned += 1
                  lines = file.read_text(encoding="utf-8", errors="replace").splitlines()
                  for number, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if stripped.startswith("//") or stripped.startswith("*"):
                          continue
                      for label, pattern in patterns:
                          if pattern.search(line):
                              violations.append((str(file), number, label, stripped[:220]))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Hugeicons-only policy\n\n")
              out.write(f"- Dart files scanned: **{scanned}**\n")
              out.write(f"- Forbidden icon patterns: **{len(violations)}**\n\n")
              if violations:
                  out.write("| File | Line | Violation | Source |\n|---|---:|---|---|\n")
                  for file, line, label, source in violations:
                      out.write(f"| `{file}` | {line} | {label} | `{source.replace('|', chr(92)+'|')}` |\n")
              else:
                  out.write("✅ No Material Icons, ImageIcon, handwritten SVG, or custom-painted icons found.\n")
          if violations:
              print("Hugeicons-only policy failed:")
              for file, line, label, source in violations:
                  print(f"{file}:{line}: {label}: {source}")
              sys.exit(1)
          print(f"Hugeicons-only policy passed ({scanned} Dart files scanned).")
          PY

      - name: Analyze Dart code and create report
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --machine 2>&1 | tee analyze-output.txt
          analyze_status=${PIPESTATUS[0]}
          echo "exit_code=$analyze_status" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path("analyze-output.txt").read_text(errors="replace").splitlines()
          diagnostics = []
          for line in lines:
              parts = line.split("|", 7)
              if len(parts) < 8 or parts[0] not in {"ERROR", "WARNING", "INFO"}:
                  continue
              severity, kind, code, file, row, col, length, message = parts
              diagnostics.append((severity, file, row, col, code, message))

          errors = sum(item[0] == "ERROR" for item in diagnostics)
          warnings = sum(item[0] == "WARNING" for item in diagnostics)
          infos = sum(item[0] == "INFO" for item in diagnostics)
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as out:
              out.write("## Flutter Analyze report\n\n")
              out.write("| وضعیت | خطا | هشدار | اطلاعات |\n|---|---:|---:|---:|\n")
              status = "❌ ناموفق" if errors else "✅ بدون خطا"
              out.write(f"| {status} | {errors} | {warnings} | {infos} |\n\n")
              if diagnostics:
                  out.write("### جزئیات موارد پیدا شده\n\n")
                  out.write("| سطح | فایل | خط | ستون | کد | توضیح |\n|---|---|---:|---:|---|---|\n")
                  for severity, file, row, col, code, message in diagnostics:
                      safe = message.replace("|", "\\|").replace("\n", " ")
                      out.write(f"| {severity} | `{file}` | {row} | {col} | `{code}` | {safe} |\n")
              else:
                  out.write("هیچ موردی توسط تحلیل‌گر Dart گزارش نشد.\n")
          PY

          exit "$analyze_status"

      - name: Run tests
        id: tests
        if: always() && steps.analyze.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee flutter-test-output.txt

      - name: Build offline Flutter Web app
        if: always() && steps.analyze.outcome == 'success'
        run: flutter build web --release

      - name: Verify offline web assets
        if: always() && steps.analyze.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/flutter_service_worker.js
          if grep -Eiq '<script[^>]+src="https?://' build/web/index.html; then
            echo "::error::External script dependency found in web/index.html"
            exit 1
          fi
          echo "Offline web shell and Flutter service worker are present." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add test result to summary
        if: always()
        shell: bash
        run: |
          if [ -f flutter-test-output.txt ]; then
            if grep -q "All tests passed" flutter-test-output.txt; then
              echo -e "\n## Flutter tests\n\n✅ همه تست‌ها موفق بودند." >> "$GITHUB_STEP_SUMMARY"
            else
              echo -e "\n## Flutter tests\n\n❌ تست‌ها ناموفق بودند یا خروجی کامل نشد. جزئیات در لاگ مرحله Run tests است." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload analysis and test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-diagnostics
          path: |
            analyze-output.txt
            flutter-test-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail workflow if analysis or tests failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.analyze.outputs.exit_code }}" != "0" ] || [ "${{ steps.tests.outcome }}" = "failure" ]; then
            exit 1
          fi
