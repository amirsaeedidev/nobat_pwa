name: datetime
description: "DateTime — سامانه مدیریت نوبت‌دهی و رزرو آنلاین"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.3
  go_router: ^14.6.2
  fl_chart: ^0.69.2
  intl: ^0.20.2
  hugeicons: ^4.4.0
  excel: ^4.0.6
  file_saver: ^0.7.0
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/image/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/Iconapp.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/image/Iconapp.png"
    background_color: "#FFFFFF"
    theme_color: "#8632E6"
